<title>TRPGシナリオジェネレーター</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f1ea;color:#222}
main{max-width:760px;margin:auto;padding:20px 14px 40px}header{background:#171717;color:#fff;border-radius:20px;padding:22px 20px;margin-bottom:14px}
h1{font-size:24px;margin:0 0 6px}header p{margin:0;color:#ddd;font-size:13px}button{width:100%;border:0;border-radius:16px;padding:17px;font-size:18px;font-weight:700;background:#222;color:#fff;box-shadow:0 5px 14px #0002;cursor:pointer}
button:active{transform:translateY(1px)}.secondary{margin-top:9px;background:#fff;color:#222;border:1px solid #ddd;font-size:14px;padding:12px;box-shadow:none}
.card{background:#fff;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 2px 12px #0000000b}.card h2{font-size:15px;margin:0 0 12px;color:#666}
.result{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.result:last-child{border-bottom:0}
.num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#eee;font-weight:700}.cat{font-size:11px;color:#888}.theme{font-size:18px;font-weight:700}
.mythos{font-size:22px;font-weight:800}.dice{font-size:12px;color:#888;margin-top:3px}.mythDesc{font-size:14px;line-height:1.75;color:#555;margin-top:10px;white-space:pre-line}
.hidden{display:none}.note{font-size:12px;color:#777;line-height:1.6;margin-top:12px}
</style>

<body>
<main>
<header><h1>TRPGシナリオジェネレーター</h1><p>1d20 → 1d10 × 5 → 1d100。重複テーマは自動で振り直します。</p></header>

</section>
</main>

let lastResult=null;
function rand(max){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max;}
function generate(){
 const chosen=[];const used=new Set();
 while(chosen.length<5){
   const ci=rand(categories.length), ii=rand(categories[ci].items.length), item=categories[ci].items[ii];
   if(used.has(item))continue;
   used.add(item);chosen.push({category:categories[ci].name,item});
 }
 const roll=rand(100)+1,m=mythos[roll-1];
 document.getElementById("themes").innerHTML=chosen.map((x,i)=>`<div class="result"><div class="num">${i+1}</div><div><div class="cat">${x.category}</div><div class="theme">${x.item}</div></div></div>`).join("");
 document.getElementById("mythos").textContent=m.name;
 document.getElementById("mythDice").textContent=`1d100 = ${roll}`;
 document.getElementById("mythDesc").textContent=m.desc;
 document.getElementById("prompt").textContent=`「${chosen.map(x=>x.item).join("・")}」と「${m.name}」をすべて使ってTRPGシナリオを構成する。`;
 document.getElementById("output").classList.remove("hidden");
 lastResult={chosen,roll,mythos:m};
}
document.getElementById("generate").addEventListener("click",generate);
document.getElementById("copy").addEventListener("click",async()=>{
 if(!lastResult){alert("先に「シナリオを生成」を押してください。");return;}
 const text=["【TRPGシナリオジェネレーター】","■ 5つのテーマ",...lastResult.chosen.map((x,i)=>`${i+1}. ${x.item}（${x.category}）`),`■ 神話生物（1d100） ${lastResult.roll}`,lastResult.mythos.name,lastResult.mythos.desc,"■ シナリオの核",`5テーマ「${lastResult.chosen.map(x=>x.item).join("・")}」と神話生物「${lastResult.mythos.name}」をすべて使ってシナリオ化。`].join("\n");
 try{await navigator.clipboard.writeText(text);alert("結果をコピーしました。");}catch(e){prompt("コピーできなかったため、以下をコピーしてください。",text);}
});
</script>
