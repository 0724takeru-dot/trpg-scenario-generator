<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>TRPGシナリオジェネレーター</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f1ea;color:#222}
main{max-width:760px;margin:auto;padding:20px 14px 40px}header{background:#171717;color:#fff;border-radius:20px;padding:22px 20px;margin-bottom:14px}
h1{font-size:24px;margin:0 0 6px}header p{margin:0;color:#ddd;font-size:13px}button{width:100%;border:0;border-radius:16px;padding:17px;font-size:18px;font-weight:700;background:#222;color:#fff;box-shadow:0 5px 14px #0002;cursor:pointer}
button:active{transform:translateY(1px)}.secondary{margin-top:9px;background:#fff;color:#222;border:1px solid #ddd;font-size:14px;padding:12px;box-shadow:none}
.card{background:#fff;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 2px 12px #0000000b}.card h2{font-size:15px;margin:0 0 12px;color:#666}
.result{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.result:last-child{border-bottom:0}
.num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#eee;font-weight:700}.cat{font-size:11px;color:#888}.theme{font-size:18px;font-weight:700}
.mythos{font-size:22px;font-weight:800}.dice{font-size:12px;color:#888;margin-top:3px}.mythDesc{font-size:14px;line-height:1.75;color:#555;margin-top:10px;white-space:pre-line}
.hidden{display:none}.note{font-size:12px;color:#777;line-height:1.6;margin-top:12px}
</style>
</head>
<body>
<main>
<header><h1>TRPGシナリオジェネレーター</h1><p>1d20 → 1d10 × 5 → 1d100。重複テーマは自動で振り直します。</p></header>
<button id="generate">🎲 シナリオを生成</button>
<button class="secondary" id="copy">結果をコピー</button>
<section id="output" class="hidden">
<div class="card"><h2>◆ 5つのテーマ</h2><div id="themes"></div></div>
<div class="card"><h2>◆ 神話生物（1d100）</h2><div id="mythos" class="mythos"></div><div id="mythDice" class="dice"></div><div id="mythDesc" class="mythDesc"></div></div>
<div class="card"><h2>◆ シナリオの核</h2><div id="prompt"></div></div>
</section>
</main>
<script>
const categories=[{"name":"機械・乗り物","items":["自動車","電車","新幹線","飛行機","船","バイク","自転車","ロボット","掃除機","洗濯機"]},{"name":"感情・感覚","items":["喜び","怒り","悲しみ","恐怖","驚き","嫉妬","恥","安心","寂しさ","懐かしさ"]},{"name":"食べ物・飲み物","items":["寿司","ラーメン","カレー","ハンバーグ","うどん","焼肉","ピザ","ケーキ","アイスクリーム","コーヒー"]},{"name":"動物・生き物","items":["犬","猫","ライオン","ゾウ","キリン","サル","ウサギ","ペンギン","イルカ","カブトムシ"]},{"name":"植物・花","items":["桜","ひまわり","チューリップ","バラ","たんぽぽ","朝顔","梅","松","竹","藤"]},{"name":"自然・天候","items":["太陽","月","星","雨","雪","雷","台風","虹","火山","滝"]},{"name":"人・職業","items":["医者","看護師","教師","警察官","消防士","料理人","大工","農家","漁師","パイロット"]},{"name":"場所・建物","items":["学校","病院","駅","城","神社","寺","公園","遊園地","図書館","コンビニ"]},{"name":"道具・日用品","items":["時計","傘","鉛筆","ハサミ","鍋","包丁","眼鏡","財布","鞄","スマートフォン"]},{"name":"武器・防具","items":["刀","槍","弓","鉄砲","斧","鎌","手裏剣","盾","鎧","兜"]},{"name":"スポーツ・遊び","items":["野球","サッカー","バスケットボール","テニス","水泳","卓球","将棋","囲碁","鬼ごっこ","かくれんぼ"]},{"name":"音楽・楽器","items":["ピアノ","ギター","ドラム","バイオリン","トランペット","フルート","太鼓","ハーモニカ","オルガン","三味線"]},{"name":"物語・フィクション","items":["タイムトラベル","異世界","ループ","入れ替わり","記憶喪失","復讐","宝探し","脱出","秘密結社","終末"]},{"name":"服・装飾品","items":["シャツ","ズボン","スカート","ワンピース","制服","着物","帽子","靴","ネックレス","指輪"]},{"name":"国・地域・都市","items":["日本","アメリカ","中国","韓国","イギリス","フランス","イタリア","インド","東京","北海道"]},{"name":"歴史・文化","items":["戦国時代","江戸時代","武士","茶道","華道","歌舞伎","相撲","能","俳句","浮世絵"]},{"name":"神話・伝説・空想","items":["ドラゴン","天使","悪魔","妖怪","吸血鬼","人魚","ユニコーン","フェニックス","巨人","魔法使い"]},{"name":"色・形・模様","items":["赤","青","黄色","緑","紫","三角形","円","星形","水玉","縞模様"]},{"name":"言葉・概念","items":["愛","友情","夢","希望","自由","平和","正義","勇気","時間","運命"]},{"name":"怖いもの・不思議なもの","items":["お化け屋敷","呪い","心霊写真","都市伝説","未確認生物","怪奇現象","謎の人物","無人の廃墟","深夜の電話","人形"]}];
const mythos=[{"name":"ビヤーキー","desc":"宇宙空間を飛翔する翼ある怪物。ハスターの召喚に用いられる存在として知られ、地球の生物とは異なる不快な生態を持つ。空からの襲撃、召喚儀式、異星への移動を絡めた事件に向く。"},{"name":"チャコタ","desc":"人間の認識を越えた巨大な異形として現れる存在。地下や閉ざされた場所に潜む怪異として扱いやすく、探索者が見つけた痕跡から正体を逆算するタイプの恐怖に向く。"},{"name":"イグの子供たち","desc":"蛇の神イグに連なる異形の一族。人間社会に紛れるよりも、血統・繁殖・土地の信仰と結び付いた怪異として描くと効果的。村落の秘密や家系を軸にしたシナリオと相性がよい。"},{"name":"クトーニアン","desc":"巨大な地中生物で、地上からは地震や地盤の異変として影響が現れる。地下遺跡、鉱山、都市の地下構造などを舞台にすると使いやすく、姿を見せる前から脅威を感じさせられる。"},{"name":"色彩のもの","desc":"宇宙から飛来した、通常の生物とは異なる色彩そのものに近い存在。周囲の生命力を奪い、土地そのものを変質させる怪異として扱える。井戸、隕石、農地など日常の場所を徐々に壊す展開に向く。"},{"name":"這い寄る者","desc":"姿や性質を一定に捉えにくい異形。人間の理解をすり抜ける怪物として、目撃証言が食い違う事件や、正体を最後まで隠すミステリーに利用できる。"},{"name":"ダーク・ワン","desc":"人間とは異なる暗黒の種族として描かれる存在。地下や異界との接点を作りやすく、秘教的な集団や禁忌の儀式と組み合わせると、人間社会の裏側に潜む恐怖を作れる。"},{"name":"暗黒の若者","desc":"シュブ＝ニグラスと結び付けられる大型の異形。森や農村に出現させると、豊穣信仰がいつの間にか異常な祭祀へ変わっていた、という構図を作りやすい。"},{"name":"深きもの","desc":"海底に棲む半魚人のような知的種族。沿岸の町、漁村、海難事故、秘密の信仰などと結び付けやすい。人間との交配や血統を使えば、身近な人物に隠された秘密にも発展させられる。"},{"name":"S'glhuoの住人","desc":"異界S'glhuoに由来する異形の住人。地球の生物学とは異なる存在として、異次元への接触や召喚実験の事故に向く。未知の法則に巻き込まれるタイプのシナリオで使いやすい。"},{"name":"イアディスの住人","desc":"遠い世界イアディスに関わる異形の存在。地球とは異なる文明や環境を背景にできるため、宇宙的な探査や異星との接触を扱うシナリオに向く。"},{"name":"ドール","desc":"夢の国に関わる異形の存在。現実世界だけでは説明できない出来事の裏側に配置し、夢と現実を往復する構成に使いやすい。探索者自身の夢を手掛かりにする展開とも相性がよい。"},{"name":"次元をさまようもの","desc":"複数の次元を移動できる怪物。突然の出現と消失を利用して、逃走経路の消失や密室の謎を演出できる。物理的な追跡だけでは解決できない事件に向く。"},{"name":"古のもの","desc":"極めて古い異星生命体で、人類以前から地球に存在していたとされる。遺跡や未知の生物学を通して痕跡を残せるため、失われた文明や太古の地球を題材にした探索に向く。"},{"name":"炎の吸血鬼","desc":"炎に似た性質を持つ異形の生命体。接近するだけで火災や異常な熱を引き起こす存在として扱える。山火事、火災現場、発電施設など、火を必要とする舞台と好相性。"},{"name":"飛行するポリプ","desc":"古代から地球に存在した、巨大な浮遊性の異形。風や物理法則を操るような現象を伴わせられる。地下遺跡や封印された都市を舞台に、太古の脅威が再び活動を始める展開に向く。"},{"name":"フォルムレス・スポーン","desc":"姿を固定しない黒い粘液状の存在。物質的な形状そのものが脅威になるため、排水路、地下室、井戸など狭い場所での遭遇が効果的。追跡不能な怪物として恐怖を演出できる。"},{"name":"ガスト","desc":"荒涼とした場所や夢の世界に現れる捕食性の怪物。人間の死体を餌とする存在として、墓地や廃墟の不穏さを強調できる。閉鎖された地下空間での遭遇にも向く。"},{"name":"グール","desc":"死体を食らう人型の屍食鬼。墓地や地下墓所に巣食い、人間社会のすぐ隣に潜む怪物として使いやすい。失踪事件、墓荒らし、遺体の消失から始めると導入しやすい。"},{"name":"グノフ＝ケー","desc":"雪原や寒冷地に潜む毛深い異形。極寒という環境そのものを敵にできるのが特徴で、吹雪の山、雪山の遭難、極地探検などと相性がよい。"},{"name":"大いなる種族","desc":"時間を越えて精神を交換できる高度な知性種族。本人の記憶と身体が一致しない事件を作れるため、入れ替わり、記憶喪失、未来からの警告などのテーマと特に相性がよい。"},{"name":"ググ","desc":"夢の国に棲む巨大で獰猛な種族。巨大な体格と異様な身体構造を活かし、現実世界の常識が通じない夢の領域での追跡や脱出劇に向く。"},{"name":"グヤア＝ヨースン","desc":"異界的な獣として描かれる存在で、辺境や地下世界の怪異に向く。人里から隔絶された土地で、古い伝承だけがその存在を伝えている構成に使いやすい。"},{"name":"ティンダロスの猟犬","desc":"時間の曲線や角から現れる捕食者。時間旅行、過去改変、奇妙な時計や幾何学的な部屋を事件の鍵にできる。逃げても時間そのものを越えて追ってくる恐怖を演出しやすい。"},{"name":"ハンティング・ホラー","desc":"巨大な蛇や翼ある怪物を思わせる狩猟者。夜空や荒野から突然襲来する敵として使いやすく、追跡・逃走中心のシナリオに向く。"},{"name":"シャッガイの昆虫","desc":"異星シャッガイから来た知的な昆虫型生命体。高度な科学技術と人類への実験的な関わりを組み込める。宇宙船、研究施設、奇妙な通信を入口にすると扱いやすい。"},{"name":"レンの蜘蛛","desc":"レンの地に棲む巨大な蜘蛛。夢の国の迷宮や洞窟を舞台に、糸で作られた道や罠を利用した探索を構成できる。蜘蛛そのものへの生理的恐怖とも相性がよい。"},{"name":"ロイガー","desc":"精神や異界に関係する謎めいた存在として扱われる。明確な姿を最後まで見せず、夢、幻覚、不可解な儀式を通して影響を与える存在にすると宇宙的恐怖を出しやすい。"},{"name":"門に潜むもの","desc":"境界や門の向こう側に潜む異形。建物の扉、鏡、地下道などを「別の場所へ通じる境界」に変えられる。探索者が帰還するたび世界が少しずつ変わるような展開に向く。"},{"name":"ミ＝ゴ","desc":"ユゴスから来た菌類系の知的生命体。高度な科学技術を持ち、人間の脳や身体を研究対象として扱う。失踪、人体実験、脳だけが保存された証拠など、科学と怪異を結び付けるシナリオに最適。"},{"name":"精神寄生体","desc":"宿主の精神や認識に干渉するタイプの異形。本人には異常がないように見えて周囲だけが変化に気付く構成を作れる。疑心暗鬼や人格の変化を中心にした心理ホラーに向く。"},{"name":"月棲獣","desc":"月に関係する夢の世界の異形。人間を捕らえ、未知の場所へ連れ去る存在として扱える。月夜、夢、誘拐、異界への旅行を組み合わせると独特の展開を作れる。"},{"name":"夜鬼","desc":"翼を持つ奇怪な怪物で、夢の世界に現れる。姿や意図が読みにくいことを活かし、探索者を運び去る存在として使える。高所や暗闇を利用した恐怖演出に向く。"},{"name":"K'n-yanの人々","desc":"地下世界K'n-yanに栄えた高度な文明の人々。古代文明、精神操作、失われた技術などを組み込める。地底遺跡の発見から、現代社会では理解できない文化との接触へ発展させやすい。"},{"name":"鼠人間","desc":"人間に似た社会性を持ちながら、地下や暗所に潜む異形の種族。都市の地下、廃棄物、下水道など日常生活の裏側を舞台にしやすい。群れでの活動を利用した追跡劇にも向く。"},{"name":"ラット・シング","desc":"巨大な鼠を思わせる怪物。単純な獣害に見せかけながら、背後に神話的な原因を置ける。廃屋、下水道、研究施設など狭い場所での遭遇に向く。"},{"name":"砂に棲むもの","desc":"砂や乾燥した土地に潜む異形。砂漠、砂丘、乾いた地下遺跡などで、地面そのものが安全ではない恐怖を作れる。失踪者が砂の中へ引き込まれる導入とも相性がよい。"},{"name":"蛇人間","desc":"古代から存在する爬虫類型の知的種族。人間社会への潜伏、古代遺跡、失われた魔術や科学を組み合わせやすい。偽装した人物を探すミステリーにも使える。"},{"name":"シャンタク鳥","desc":"巨大で異様な姿をした飛行生物。夢の国や異界への移動手段としても、怪物としての遭遇にも利用できる。空路そのものが危険になる展開を作りやすい。"},{"name":"ショゴス","desc":"原始的な生命体から生まれた、巨大で可塑的な無定形生物。姿を自在に変え、単純な物理攻撃だけでは対処しにくい怪物として使える。古代施設の封印が解ける展開と特に相性がよい。"},{"name":"星の吸血鬼","desc":"姿をほとんど捉えられない透明に近い捕食者。血を吸われた痕跡だけが残る事件を作れるため、目撃者のいない連続殺人や夜間の探索に向く。"},{"name":"クトゥルフの星の落とし子","desc":"クトゥルフに似た巨大な異形で、その眷属として描かれる。人間には圧倒的な存在だが、主神そのものよりは遭遇可能な脅威として使える。海底遺跡や沿岸の祭祀との相性がよい。"},{"name":"チョー＝チョー人","desc":"山間部などに暮らす閉鎖的な人々として描かれる種族。外見だけでは普通の人間と区別しにくい構成にすると、共同体の秘密や儀式を巡る社会派ホラーに向く。"},{"name":"スペクトラル・ハンター","desc":"人間には捉えにくい異次元の狩人。突然現れて標的を追跡する存在として、逃走と生存を中心にしたシナリオへ組み込みやすい。"},{"name":"ヴーアミ族","desc":"夢の国に存在する古い人々。人間の文明とは異なる価値観を持つ異界住民として、交易、争い、禁忌、旅の目的など幅広い役割を与えられる。"},{"name":"ユッグ","desc":"奇怪な地下・異界性を持つ生物として扱える存在。地下世界の生態系を示す脅威として配置すると、単独の怪物ではなく「未知の世界の住人」という恐怖を作れる。"},{"name":"ゾーグ","desc":"夢の国の森林などに生息する小型の奇妙な生物。可愛らしさと不気味さを両立させやすく、異界の日常や探索者の常識が通用しない環境を表現するのに便利。"},{"name":"深きものの混血","desc":"外見上は人間に見えるが、深きものの血を受け継ぐ者。身体の変化や海への異常な親和性を手掛かりに、本人も知らない出生の秘密を追うシナリオに向く。"},{"name":"ナイトゴーント","desc":"顔のない黒い翼の怪物。夢の中で探索者をさらったり運んだりする存在として、追跡よりも「どこへ連れて行かれるか」という未知を恐怖にできる。"},{"name":"ダーク・ヤング","desc":"シュブ＝ニグラスと結び付けられる大型の森の怪物。角、蹄、植物的な要素を祭祀と結び付け、森の豊穣信仰が異形の崇拝へ変わる展開に使える。"},{"name":"アブホース","desc":"原始的な泥や生命の塊から無数の異形を生み出す存在。地下深くや異界の淵に配置し、怪物が次々と増殖する生態系そのものを脅威にできる。"},{"name":"アフォーム・ザッハ","desc":"氷と冷気に結び付く巨大な存在。凍結、異常気象、雪原の封鎖などを事件の兆候として扱えるため、極寒の土地での生存劇に向く。"},{"name":"アルワッサ","desc":"異様な姿と強大な力を持つ古き存在。人間の文明圏から隔絶された場所に置き、古代信仰や禁忌の祭壇を守る怪物として扱うと使いやすい。"},{"name":"アトラク＝ナクア","desc":"巨大な蜘蛛の神格的存在。地下世界や異界に広大な巣を張るイメージを利用できる。失踪者が蜘蛛の糸で結ばれた巨大な迷宮へ導かれる展開に向く。"},{"name":"アザトース","desc":"宇宙の中心にある混沌そのものとされる超越的存在。直接戦わせる対象ではなく、世界の法則が崩れる原因として扱うのが効果的。現実改変や終末的な儀式の背景に向く。"},{"name":"バオート・ズッカ＝モッグ","desc":"異形の昆虫的な性質を持つ強大な存在。昆虫の大量発生、異常な巣、奇妙な祭祀などを兆候として出せる。人間が知らぬ生態系の侵入をテーマにしやすい。"},{"name":"ブグ＝シャース","desc":"血や生命力に関わる恐ろしい存在。人体から何かを奪う儀式や、生命そのものを対価にする契約を事件の中心に置ける。直接登場させず信仰だけを先に見せる構成も有効。"},{"name":"バイアティス","desc":"巨大な蛇に似た異形として知られる存在。地下や古い建築物との結び付きを利用し、石造りの遺跡や古文書から徐々に存在を明らかにするシナリオに向く。"},{"name":"チャウグナー・フォーン","desc":"象のような鼻を持つ異形の神格。彫像や美術品を通じて存在を匂わせる展開が使いやすい。芸術、血、信仰を組み合わせた怪異に向く。"},{"name":"クトゥグア","desc":"炎そのものを思わせる強大な存在。火災や異常な熱を単なる事故ではなく宇宙的な兆候として扱える。夜間の電力施設、発電、山火事などとの相性がよい。"},{"name":"クトゥルフ","desc":"海底都市ルルイエに眠る巨大な存在。夢を通じて人間へ影響を与えるため、海難事故だけでなく奇妙な夢や集団的な狂気から事件を始められる。完全な戦闘より「目覚めの兆候」を脅威にすると扱いやすい。"},{"name":"クティラ","desc":"クトゥルフに連なる強大な存在。海洋、卵、古代種族などを軸に、単なる怪物退治ではない神話的な事件へ発展させられる。海底に眠る何かを守る存在として配置するのも有効。"},{"name":"シアエガ","desc":"巨大な単眼を持つ異形の神格。森や沼、孤立した集落に根付く信仰と組み合わせやすい。村人が「守り神」と呼ぶ存在が実は人間を見つめ続けている、という構成に向く。"},{"name":"シノトグリス","desc":"異形の神格的存在で、肉体や生命に対する恐怖を連想させる。人体改造、異常な病、禁忌の儀式などを絡め、原因不明の身体変化を追うシナリオに使える。"},{"name":"ダオロス","desc":"時間や空間の境界に関係する超越的存在。時計、鏡、幾何学、異常な部屋などを手掛かりにできる。現実の一部だけがずれていくタイプの不条理ホラーに向く。"},{"name":"エイホート","desc":"巨大な眼や触手を思わせる異形の存在。地下や洞窟に潜む怪物として、地底探査や鉱山事故の背後に配置できる。人間を巣へ誘い込む儀式と組み合わせてもよい。"},{"name":"父なるダゴン","desc":"海と深きものの信仰に結び付く巨大な存在。沿岸集落の豊漁、海難、異常な海洋生物などを兆候にできる。町全体が古い海の契約を守っている構成に向く。"},{"name":"フサグア","desc":"炎と宇宙的な生命に関係する異形。火災や熱を単なる自然現象から神話的な事件へ転換できる。炎を媒介にした召喚や研究事故の黒幕として使いやすい。"},{"name":"ガタノソア","desc":"遠い土地に伝わる巨大な存在で、見る者の肉体を異常な状態へ変える恐怖と結び付く。古代遺跡や封印された神殿を舞台に、視認そのものが危険になる怪異を作れる。"},{"name":"グロース","desc":"宇宙規模の変動や災厄を象徴する存在。直接姿を現すより、天体観測、異常な潮汐、地震などを前兆として扱うとスケール感が出る。終末予測を巡る調査にも向く。"},{"name":"グラーキ","desc":"湖や地下水域に潜む巨大な異形。棘や針を持つ身体と、不死者を増やす性質を利用できる。静かな湖畔の町で住民が少しずつ変質していく展開に向く。"},{"name":"ハスター","desc":"黄衣の王やハリ湖などと結び付けられる強大な存在。黄色、演劇、王、異界の都市などを象徴として配置できる。正体を明かさず、作品や舞台を介して狂気が広がる構成に向く。"},{"name":"ヒュドラ","desc":"海や水域に結び付く巨大な存在。母なる海、怪物的な血統、古い漁村などを題材にできる。海岸で見つかる巨大な鱗や異常な産卵跡を手掛かりにする展開が使いやすい。"},{"name":"ヒュプノス","desc":"眠りや夢に関わる神格的存在。睡眠障害、夢の共有、眠るたびに変化する世界などを事件の中心に置ける。探索者自身が夢の中で情報を得る一方、現実との境界を失う展開に向く。"},{"name":"フジウルクォイグムンズハー","desc":"古い蛇の神格的存在。蛇、洞窟、地下祭祀などのイメージと組み合わせやすく、閉鎖的な宗教集団の背後に置くことで古代信仰の恐怖を演出できる。"},{"name":"イダー＝ヤアー","desc":"遠い宇宙に属する強大な存在。地球の宗教では説明できない宇宙的な信仰を描きたいときに使える。天体観測や異星からの通信を事件の入口にすると扱いやすい。"},{"name":"イオド","desc":"姿や性質が一定しない謎めいた存在として知られる。人間の知覚では捉えきれない怪異を演出でき、研究者の記録や断片的な証言から正体へ迫るシナリオに向く。"},{"name":"イタクァ","desc":"風雪や極北に結び付く巨大な存在。吹雪、失踪、凍死体などを手掛かりにし、極寒の土地で探索者を追い詰める自然災害型の恐怖に向く。"},{"name":"イダーラ","desc":"蛇や植物的な生命のイメージと結び付けられる神話的存在。森や古代の祭祀を舞台に、豊穣と繁殖が異常な方向へ変質していく事件を構成しやすい。"},{"name":"ユソ＝トラゴン","desc":"破壊と異界からの侵入を連想させる強大な存在。人間の世界へ異質なものを呼び込む儀式や、封印を破る研究者の欲望と組み合わせやすい。宇宙的な破局が目前に迫る終盤の脅威としても使える。"},{"name":"ムナガラー","desc":"異界的な生命体・神格として、生命の変質や怪物の発生源に使える。研究施設や秘密結社がその力を利用しようとして破綻する展開に向く。"},{"name":"ムノムクァ","desc":"夢の国の月に関係する巨大な存在。月、夢、夜空を手掛かりにして、眠っている間だけ起きる異変を調査するシナリオに利用できる。"},{"name":"モルディギアン","desc":"死者と墓所に結び付く存在。墓地、葬儀、死体の消失を中心にした事件に向く。死を恐れる人間が逆にその存在へ救いを求める構成にすると、人間側の欲望も描ける。"},{"name":"ニャルラトホテプ","desc":"無数の姿を取り、人間社会へ直接介入することができる存在。神話生物の中でも「人間を利用する敵」として扱いやすい。謎の人物、宗教家、芸術家、旅人など様々な役割で登場させられる。"},{"name":"ニョグタ","desc":"地下や闇に結び付く巨大な存在。洞窟、地下祭祀、血の儀式などと組み合わせ、地上から隔絶された共同体の信仰を描くシナリオに向く。"},{"name":"オテュグア","desc":"巨大な異形として、古代の信仰や未知の土地と結び付けて扱える。荒野や遺跡に残る巨大な痕跡を手掛かりに、探索者が「何を起こしてしまったのか」を追う構成に向く。"},{"name":"クァチル・ウタウス","desc":"死や時間に関係する超越的な存在。墓、遺体、老化、時間の逆行などをテーマにできる。死を避けようとする人物の願いが、別の形の恐怖を生む展開に向く。"},{"name":"ラーン＝テゴス","desc":"古代の巨大な異形で、忘れ去られた土地に潜む存在として使える。博物館の標本、古代遺物、地下遺跡などを入口にして、現代へ蘇る怪物を描きやすい。"},{"name":"リム＝シャイコース","desc":"巨大な氷の異形として、極寒の地域や海域と結び付けられる。氷山の中の遺跡や異常な低温を手掛かりに、自然環境そのものが敵になるシナリオに向く。"},{"name":"シュブ＝ニグラス","desc":"森、繁殖、豊穣と結び付く巨大な神格。豊作や子宝を願う祭祀が、異常な繁殖や怪物の誕生へ変わる構成に非常に使いやすい。信仰者を単純な悪人にしない展開も作れる。"},{"name":"シュド＝メル","desc":"地底深くに潜む巨大な存在として、地下世界や大規模な地殻変動と結び付けられる。鉱山、洞窟、地下都市などで、地面の下に別世界がある恐怖を演出できる。"},{"name":"ツァトゥグァ","desc":"洞窟や地下神殿と結び付く、蛙やナマケモノを思わせる神格。知識や魔術を求める人間が供物を捧げる構成に向き、怠惰と知識欲を皮肉る怪異にもできる。"},{"name":"トゥルスチャ","desc":"炎や緑色の光を伴う異形の存在。夜の森や墓地などで不可解な光として先に存在を示せる。怪異の正体を視認すること自体が危険な演出に向く。"},{"name":"ウボ＝サスラ","desc":"原初の生命の源とされる巨大な存在。無数の生命体や異形が生まれる場所として扱えるため、生命の起源、進化、禁断の実験をテーマにしたシナリオに向く。"},{"name":"ヴォルヴァドス","desc":"異界や夢に関わる強大な存在。現実とは異なる風景や奇妙な儀式を用いて、探索者が知らない世界の法則に触れる展開を作れる。"},{"name":"ヴルダラク","desc":"宇宙的な異形の存在として、未知の天体や古代文明との接触に利用できる。研究者が断片的な情報だけを残して失踪する事件など、調査型の導入に向く。"},{"name":"ユブ＝サトゥラ","desc":"知識と生命の源流に関わる古き存在。古代の知識を求める者が、その知識と引き換えに人間性を失う構成に向く。禁断の図書館や地下文庫とも相性がよい。"},{"name":"ユゴスのヴォルターム","desc":"異星ユゴスに関わる神話的存在。遠い惑星との接触、宇宙旅行、異星からの信号などを背景に置ける。未知の文明との遭遇を人類側の理解不足から恐怖へ転換しやすい。"},{"name":"イゴーロナク","desc":"人間の欲望や背徳と結び付けて扱える強大な存在。禁断の知識や権力を求める人物に力を与え、その代償として人間性を奪う構成に向く。悪人だけでなく善意の人物を堕とす展開にも使える。"},{"name":"ヨグ＝ソトース","desc":"時間と空間の境界を越えて存在する超越的な存在。門、鍵、異世界、時間旅行などのテーマと非常に相性がよい。直接戦うより、知識を得ることで世界の真実を知ってしまう恐怖に向く。"}];
let lastResult=null;
function rand(max){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max;}
function generate(){
 const chosen=[];const used=new Set();
 while(chosen.length<5){
   const ci=rand(categories.length), ii=rand(categories[ci].items.length), item=categories[ci].items[ii];
   if(used.has(item))continue;
   used.add(item);chosen.push({category:categories[ci].name,item});
 }
 const roll=rand(100)+1,m=mythos[roll-1];
 document.getElementById("themes").innerHTML=chosen.map((x,i)=>`<div class="result"><div class="num">${i+1}</div><div><div class="cat">${x.category}</div><div class="theme">${x.item}</div></div></div>`).join("");
 document.getElementById("mythos").textContent=m.name;
 document.getElementById("mythDice").textContent=`1d100 = ${roll}`;
 document.getElementById("mythDesc").textContent=m.desc;
 document.getElementById("prompt").textContent=`「${chosen.map(x=>x.item).join("・")}」と「${m.name}」をすべて使ってTRPGシナリオを構成する。`;
 document.getElementById("output").classList.remove("hidden");
 lastResult={chosen,roll,mythos:m};
}
document.getElementById("generate").addEventListener("click",generate);
document.getElementById("copy").addEventListener("click",async()=>{
 if(!lastResult){alert("先に「シナリオを生成」を押してください。");return;}
 const text=["【TRPGシナリオジェネレーター】","■ 5つのテーマ",...lastResult.chosen.map((x,i)=>`${i+1}. ${x.item}（${x.category}）`),`■ 神話生物（1d100） ${lastResult.roll}`,lastResult.mythos.name,lastResult.mythos.desc,"■ シナリオの核",`5テーマ「${lastResult.chosen.map(x=>x.item).join("・")}」と神話生物「${lastResult.mythos.name}」をすべて使ってシナリオ化。`].join("\n");
 try{await navigator.clipboard.writeText(text);alert("結果をコピーしました。");}catch(e){prompt("コピーできなかったため、以下をコピーしてください。",text);}
});
</script>
