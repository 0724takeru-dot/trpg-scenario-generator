<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>TRPGシナリオジェネレーター</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f1ea;color:#222}
main{max-width:760px;margin:auto;padding:20px 14px 40px}
header{background:#171717;color:#fff;border-radius:20px;padding:22px 20px;margin-bottom:14px}
h1{font-size:24px;margin:0 0 6px} header p{margin:0;color:#ddd;font-size:13px}
button{width:100%;border:0;border-radius:16px;padding:17px;font-size:18px;font-weight:700;background:#222;color:#fff;box-shadow:0 5px 14px #0002;cursor:pointer}
button:active{transform:translateY(1px)}
.secondary{margin-top:9px;background:#fff;color:#222;border:1px solid #ddd;font-size:14px;padding:12px;box-shadow:none}
.card{background:#fff;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 2px 12px #0000000b}
.card h2{font-size:15px;margin:0 0 12px;color:#666}
.result{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.result:last-child{border-bottom:0}.num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#eee;font-weight:700}
.cat{font-size:11px;color:#888}.theme{font-size:18px;font-weight:700}
.mythos{font-size:22px;font-weight:800}.dice{font-size:12px;color:#888;margin-top:3px}
.mythDesc{font-size:14px;line-height:1.75;color:#555;margin-top:10px;white-space:pre-line}
.hidden{display:none}.note{font-size:12px;color:#777;line-height:1.6;margin-top:12px}
</style>
</head>
<body>
<main>
<header>
<h1>TRPGシナリオジェネレーター</h1>
<p>1d20 → 1d10 × 5 → 1d100。重複テーマは自動で振り直します。</p>
</header>
<button id="generate">🎲 シナリオを生成</button>
<button class="secondary" id="copy">結果をコピー</button>
<section id="output" class="hidden">
<div class="card"><h2>◆ 5つのテーマ</h2><div id="themes"></div></div>
<div class="card"><h2>◆ 神話生物（1d100）</h2><div id="mythos" class="mythos"></div><div id="mythDice" class="dice"></div><div id="mythDesc" class="mythDesc"></div></div>
<div class="card"><h2>◆ シナリオの核</h2><div id="prompt"></div></div>
<div class="note">※神話生物名と解説はシナリオ作成用のオリジナル整理データです。版・サプリメントによって名称・設定・扱いが異なる場合があります。</div>
</section>
</main>
<script>
